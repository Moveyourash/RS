<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Plan">
<title>Private plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf8f3;
    --ink: #1c1b19;
    --soft: #6d6a63;
    --rule: #dcd7cc;
    --clay: #9c5b3f;
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151412;
      --ink: #efebe3;
      --soft: #a39e94;
      --rule: #34322d;
      --clay: #d39474;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 16.5px/1.65 var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  p { margin: 0 0 14px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  .label, .eyebrow, .weeks, h3, nav a, .stat span b, footer {
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  /* Lock screen */
  #lock {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  #lock form { width: 100%; max-width: 360px; text-align: center; }
  #lock .label { color: var(--soft); }
  #lock h1 {
    font: 400 46px/1.05 var(--serif);
    letter-spacing: -.01em;
    margin: 18px 0 14px;
  }
  #lock h1 em { font-weight: 400; }
  #lock p { color: var(--soft); font-size: 15px; margin-bottom: 34px; }
  #lock input[type=password] {
    width: 100%;
    padding: 12px 4px;
    font: 400 17px var(--sans);
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--ink);
    border-radius: 0;
    text-align: center;
    letter-spacing: .08em;
  }
  #lock input[type=password]::placeholder { color: var(--soft); letter-spacing: .04em; }
  #lock input[type=password]:focus { outline: none; border-bottom-width: 2px; padding-bottom: 11px; }
  #lock label.remember {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 18px 0 0; font-size: 13.5px; color: var(--soft);
  }
  #lock label.remember input { accent-color: var(--ink); }
  #lock button {
    width: 100%;
    margin-top: 26px;
    padding: 15px;
    font: 500 11.5px var(--sans);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--ink);
    border: 0; border-radius: 0;
    cursor: pointer;
  }
  #lock button:disabled { opacity: .55; cursor: default; }
  #msg { min-height: 22px; margin: 14px 0 0; font-size: 14px; color: var(--clay); }

  /* Masthead */
  .hero { padding: 0 0 8px; }
  .eyebrow {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 22px 0 16px;
    border-bottom: 1px solid var(--ink);
    color: var(--ink);
  }
  .hero h1 {
    font: 400 clamp(46px, 10.5vw, 112px)/.95 var(--serif);
    letter-spacing: -.025em;
    margin: clamp(40px, 8vw, 88px) 0 clamp(22px, 4vw, 36px);
    max-width: 11ch;
  }
  .hero h1 em { font-style: italic; color: var(--clay); }
  .hero p {
    font: 400 clamp(20px, 2.6vw, 25px)/1.4 var(--serif);
    max-width: 30em;
    margin: 0 0 clamp(36px, 6vw, 64px);
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .stat { padding: 24px 24px 26px; border-left: 1px solid var(--rule); }
  .stat:first-child { border-left: 0; padding-left: 0; }
  .stat strong { display: block; font: 400 34px/1.1 var(--serif); letter-spacing: -.01em; margin-bottom: 6px; }
  .stat span { font-size: 14.5px; color: var(--soft); line-height: 1.5; display: block; }

  /* Where am I: week, phase and today's checklist */
  .today { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 30px 0 32px; }
  .t-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 56px; }
  .t-main[hidden], .setup[hidden] { display: none; }
  .today h2 { font: 400 clamp(44px, 7vw, 64px)/1 var(--serif); letter-spacing: -.02em; margin: 0 0 8px; }
  .today h2 span { color: var(--soft); font-size: .5em; letter-spacing: 0; }
  .today h2 em { font-style: italic; color: var(--clay); }
  #t-phase { font: 400 20px/1.4 var(--serif); margin: 0 0 20px; }
  .bar { display: flex; gap: 3px; margin-bottom: 24px; }
  .bar span { flex: 1; height: 6px; background: var(--rule); }
  .bar span:nth-child(5), .bar span:nth-child(9) { margin-left: 8px; }
  .bar span.done { background: var(--ink); }
  .bar span.now { background: var(--clay); }
  .t-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; }
  .btn {
    display: inline-block;
    padding: 14px 20px;
    background: none; border: 1px solid var(--ink); border-radius: 0;
    font: 500 11.5px var(--sans); letter-spacing: .18em; text-transform: uppercase; text-decoration: none;
    color: var(--ink);
    cursor: pointer;
  }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .link {
    padding: 8px 0; background: none; border: 0; border-bottom: 1px solid currentColor; border-radius: 0;
    font: 500 11.5px var(--sans); letter-spacing: .14em; text-transform: uppercase;
    color: var(--soft); cursor: pointer;
  }
  .checks > .weeks { padding-bottom: 12px; border-bottom: 1px solid var(--ink); color: var(--ink); margin: 0; }
  .chk {
    display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; column-gap: 14px; align-items: start;
    padding: 15px 0; border-bottom: 1px solid var(--rule);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .chk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chk i { position: relative; width: 26px; height: 26px; border: 1.5px solid var(--ink); margin-top: 1px; }
  .chk input:checked + i { background: var(--ink); }
  .chk input:checked + i::after {
    content: ""; position: absolute; left: 6px; top: 6px; width: 11px; height: 6px;
    border-left: 2px solid var(--paper); border-bottom: 2px solid var(--paper); transform: rotate(-45deg);
  }
  .chk input:focus-visible + i { outline: 2px solid var(--clay); outline-offset: 2px; }
  .chk b { display: block; font-weight: 500; font-size: 17px; }
  .chk input:checked ~ span b { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--soft); }
  .chk small { display: block; font-size: 14.5px; color: var(--soft); }
  .chk small.rest { color: var(--clay); }
  .chk small[hidden] { display: none; }
  .chk em { font: italic 400 17px/1.5 var(--serif); color: var(--soft); white-space: nowrap; }
  .strip-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: 16px; }
  .strip-row .weeks { margin: 0; }
  .strip { display: flex; gap: 5px; }
  .strip span {
    width: 26px; height: 26px; display: grid; place-items: center;
    border: 1px solid var(--rule); font-size: 11px; color: var(--soft);
  }
  .strip span.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .strip span.today { border-color: var(--clay); border-width: 2px; }
  .setup p { font: 400 20px/1.45 var(--serif); max-width: 30em; margin-bottom: 22px; }
  .setup-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .setup-row .or { font: italic 400 18px var(--serif); color: var(--soft); padding: 0 4px; }
  .setup-row input[type=date] {
    padding: 11px 12px; font: 400 16px var(--sans); color: var(--ink);
    background: transparent; border: 1px solid var(--ink); border-radius: 0; min-height: 46px;
  }
  section.now .weeks { color: var(--clay); }
  nav a.now { color: var(--ink); border-bottom-color: var(--clay); }
  nav {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
  }
  nav .wrap { display: flex; gap: 28px; overflow-x: auto; padding-top: 6px; padding-bottom: 5px; scrollbar-width: none; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a { flex: none; color: var(--soft); text-decoration: none; padding: 12px 0 10px; border-bottom: 1px solid transparent; }
  nav a:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* Sections */
  main { padding-bottom: 40px; }
  section {
    display: grid;
    grid-template-columns: 270px minmax(0, 1fr);
    column-gap: 56px;
    padding: clamp(44px, 7vw, 80px) 0;
    border-bottom: 1px solid var(--rule);
    scroll-margin-top: 50px;
  }
  section > * { grid-column: 2; }
  section > .sec-head { grid-column: 1; grid-row: 1 / span 30; align-self: start; position: sticky; top: 84px; }
  .num { font: italic 400 64px/1 var(--serif); color: var(--clay); margin-bottom: 14px; }
  .weeks { color: var(--soft); margin-bottom: 10px; }
  .sec-head h2 { font: 400 clamp(32px, 4.4vw, 42px)/1.08 var(--serif); letter-spacing: -.015em; margin: 0; }
  section > p:first-of-type { font: 400 21px/1.45 var(--serif); }
  .intro { color: var(--ink); }
  #note > p { font: 400 21px/1.5 var(--serif); max-width: 32em; }
  .portrait { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 30%; margin-top: 26px; }
  #note h2 em { font-style: italic; color: var(--clay); }
  #note > p.sig { font: italic 400 46px/1 var(--serif); color: var(--clay); margin: 26px 0 0; }
  section > p.intro { margin-bottom: 22px; }
  #note > p.cred { font: 500 11.5px/1.9 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--soft); margin: 14px 0 0; }
  h3 { color: var(--ink); margin: 34px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
  section > h3:first-of-type { margin-top: 22px; }
  .sec-head + h3, .sec-head + ul.ex { margin-top: 0; }

  ul.ex { list-style: none; margin: 0; padding: 0; counter-reset: ex; }
  ul.ex li {
    counter-increment: ex;
    display: grid;
    grid-template-columns: 34px 184px minmax(0, 1fr) auto;
    column-gap: 14px;
    align-items: start;
    padding: 18px 0 18px;
    border-bottom: 1px solid var(--rule);
  }
  .vid {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    padding: 0; margin: 0 8px 0 0;
    border: 0; border-radius: 0;
    background: var(--rule);
    overflow: hidden;
    cursor: pointer;
  }
  .vid img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(1) contrast(1.04);
    transition: filter .35s ease, transform .6s ease;
  }
  .vid:hover img, .vid:focus-visible img { filter: none; transform: scale(1.03); }
  .vid:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
  .vid i {
    position: absolute; left: 10px; bottom: 10px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(250, 248, 243, .94);
  }
  .vid i::after {
    content: "";
    position: absolute; left: 14px; top: 11px;
    border-left: 9px solid #1c1b19;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .vid.on i::after {
    left: 11px; top: 16px; width: 12px; height: 2px;
    border: 0; background: #1c1b19;
  }
  .watch {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 10px 0 0; padding: 6px 0;
    background: none; border: 0; border-bottom: 1px solid currentColor; border-radius: 0;
    font: 500 11.5px var(--sans); letter-spacing: .16em; text-transform: uppercase;
    color: var(--clay);
    cursor: pointer;
  }
  .watch::before {
    content: "";
    border-left: 7px solid currentColor;
    border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent;
  }
  li.open .watch { color: var(--ink); }
  li.open .watch::before { border: 0; width: 9px; height: 1.5px; background: currentColor; }
  .watch:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
  ul.ex small { display: block; margin-top: 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
  .player { grid-column: 2 / -1; margin-top: 18px; max-width: 680px; }
  .player .frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player .close {
    display: block; width: 100%;
    margin-top: 10px; padding: 13px;
    background: none; border: 1px solid var(--ink); border-radius: 0;
    font: 500 11.5px var(--sans); letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
  }
  .player .close:hover { background: var(--ink); color: var(--paper); }
  ul.ex li::before {
    content: counter(ex, decimal-leading-zero);
    font-size: 11.5px; letter-spacing: .1em; color: var(--soft);
    font-variant-numeric: tabular-nums;
    padding-top: 4px;
  }
  ul.ex b { display: block; font-weight: 500; font-size: 17px; }
  ul.ex span { display: block; font-size: 14.5px; color: var(--soft); max-width: 44em; }
  ul.ex em {
    font: italic 400 19px/1.3 var(--serif);
    white-space: nowrap;
    padding-left: 20px;
    text-align: right;
  }
  ul.ticks { list-style: none; margin: 14px 0 0; padding: 0; }
  ul.ticks li { position: relative; padding: 11px 0 11px 30px; border-bottom: 1px solid var(--rule); }
  ul.ticks li::before { content: ""; position: absolute; left: 0; top: 24px; width: 16px; height: 1px; background: var(--clay); }
  h3 + ul.ticks { margin-top: 0; }
  .note {
    margin: 28px 0 0; padding: 0 0 0 20px;
    border-left: 1px solid var(--clay);
    font: italic 400 19px/1.45 var(--serif);
  }
  .note strong { font-weight: 500; }

  .goals { display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 40px; border-top: 1px solid var(--ink); }
  .goal { padding: 20px 0 20px; border-bottom: 1px solid var(--rule); }
  .goal strong { display: block; font: 400 30px/1.15 var(--serif); letter-spacing: -.01em; margin-bottom: 4px; }
  .goal span { font-size: 14.5px; color: var(--soft); display: block; }

  section.warn .sec-head h2 { color: var(--clay); font-style: italic; }
  section.warn { border-bottom: 0; }
  footer { border-top: 1px solid var(--ink); padding-top: 18px; padding-bottom: 48px; color: var(--soft); line-height: 1.9; letter-spacing: .12em; }

  @media (max-width: 820px) {
    .wrap { padding: 0 20px; }
    section { display: block; }
    section > .sec-head { position: static; margin-bottom: 22px; }
    .portrait { max-width: 300px; margin-top: 20px; }
    .num { font-size: 52px; margin-bottom: 10px; }
    nav .wrap { gap: 22px; }
  }
  @media (max-width: 600px) {
    .eyebrow { font-size: 10.5px; letter-spacing: .14em; }
    .stats { grid-template-columns: 1fr; }
    .stat, .stat:first-child { border-left: 0; padding: 18px 0 20px; border-top: 1px solid var(--rule); }
    .stat:first-child { border-top: 0; }
    .goals { grid-template-columns: 1fr; }
    .t-main { grid-template-columns: 1fr; row-gap: 30px; }
    .t-actions .btn, .setup-row .btn { width: 100%; text-align: center; }
    .setup-row input[type=date] { flex: 1; }
    .setup-row .or { width: 100%; text-align: center; }
    .watch { padding: 14px 0 12px; margin-top: 4px; }
    .link { padding: 14px 0 12px; }
    .hero h1 { margin-top: 32px; }
    .hero p { margin-bottom: 30px; }
    ul.ex li { grid-template-columns: 112px minmax(0, 1fr); column-gap: 14px; }
    ul.ex li::before { display: none; }
    .vid { grid-column: 1; grid-row: 1; margin: 3px 0 0; }
    .vid i { left: 6px; bottom: 6px; width: 28px; height: 28px; }
    .vid i::after { left: 11px; top: 8px; }
    .vid.on i::after { left: 8px; top: 13px; }
    .vid + div { grid-column: 2; grid-row: 1; }
    ul.ex em { grid-column: 2; grid-row: 2; text-align: left; padding: 8px 0 0; color: var(--clay); }
    .player { grid-column: 1 / -1; grid-row: 3; }
  }
  @media print {
    nav, #lock { display: none !important; }
    body { background: #fff; font-size: 10.5pt; }
    section { break-inside: avoid; padding: 24pt 0; }
    section > .sec-head { position: static; }
  }
</style>
</head>
<body>

<div id="lock">
  <form id="lockform" autocomplete="off">
    <div class="label">Physical Therapy</div>
    <h1>A private <em>plan</em></h1>
    <p>Enter the password your physical therapist gave you.</p>
    <input id="pw" type="password" aria-label="Password" placeholder="Password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button id="go" type="submit">Open plan</button>
    <div id="msg" role="alert"></div>
  </form>
</div>

<div id="plan" hidden></div>

<script>
  // The plan is stored encrypted (AES-256, key derived from the password with PBKDF2).
  // It is decrypted here in the browser; the password is never sent anywhere.
  var ITERATIONS = 600000;
  var MARKER = '<!--plan-->';
  var KEY = 'plan-pass';

  async function decryptPlan(password, b64) {
    var raw = Uint8Array.from(atob(b64.replace(/\s+/g, '')), function (c) { return c.charCodeAt(0); });
    var salt = raw.slice(8, 16);
    var data = raw.slice(16);
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    var bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' }, base, 384));
    var key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32, 48) }, key, data);
    var html = new TextDecoder().decode(plain);
    if (html.indexOf(MARKER) !== 0) throw new Error('bad password');
    return html;
  }

  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }

  async function unlock(password, remember) {
    var html = await decryptPlan(password, document.getElementById('payload').textContent);
    var plan = document.getElementById('plan');
    plan.innerHTML = html;
    plan.hidden = false;
    document.getElementById('lock').hidden = true;
    document.getElementById('lock').style.display = 'none';
    var t = plan.querySelector('[data-title]');
    if (t) document.title = t.getAttribute('data-title');
    if (remember) save(password);
    initTracker();
    window.scrollTo(0, 0);
  }

  document.getElementById('lockform').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('go'), msg = document.getElementById('msg');
    btn.disabled = true; btn.textContent = 'Opening…'; msg.textContent = '';
    var typed = document.getElementById('pw').value.trim(), remember = document.getElementById('remember').checked;
    try {
      // Accept the password with any capitalization (phones often capitalize the first letter).
      await unlock(typed, remember).catch(function () { return unlock(typed.toLowerCase(), remember); });
    } catch (err) {
      msg.textContent = 'That password did not work. Please try again.';
      btn.disabled = false; btn.textContent = 'Open plan';
    }
  });

  // Each exercise has a video that opens under its row and closes again:
  // tap the thumbnail or "Watch demo" to open, tap again, "Close video" or Esc to close.
  function closeVideo(li) {
    var p = li.querySelector(".player");
    if (p) p.parentNode.removeChild(p);
    li.classList.remove("open");
    var v = li.querySelector(".vid"), w = li.querySelector(".watch");
    v.classList.remove("on"); v.setAttribute("aria-expanded", "false");
    w.textContent = "Watch demo"; w.setAttribute("aria-expanded", "false");
  }
  function openVideo(li) {
    Array.prototype.forEach.call(document.querySelectorAll("ul.ex li.open"), closeVideo);
    var v = li.querySelector(".vid"), w = li.querySelector(".watch");
    var p = document.createElement("div"); p.className = "player";
    var frame = document.createElement("div"); frame.className = "frame";
    var f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(v.getAttribute("data-v")) + "?autoplay=1&rel=0&playsinline=1";
    f.title = li.querySelector("b").textContent + " video";
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    frame.appendChild(f); p.appendChild(frame);
    var c = document.createElement("button"); c.type = "button"; c.className = "close"; c.textContent = "Close video";
    p.appendChild(c); li.appendChild(p);
    li.classList.add("open");
    v.classList.add("on"); v.setAttribute("aria-expanded", "true");
    w.textContent = "Close video"; w.setAttribute("aria-expanded", "true");
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest(".vid, .watch, .close") : null;
    if (!t) return;
    var li = t.closest("li");
    if (li.classList.contains("open")) {
      closeVideo(li);
      if (t.className === "close") li.querySelector(".watch").focus();
    } else openVideo(li);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") Array.prototype.forEach.call(document.querySelectorAll("ul.ex li.open"), closeVideo);
  });

  // "Where am I" panel: works out the week and phase from the start date and keeps a simple
  // daily checklist. Everything is saved only in this browser, on this device.
  function initTracker() {
    var root = document.getElementById('today');
    if (!root) return;
    var LOG = 'plan-log', mem = null;
    var PH = [['I', 'Mobility and activation', 'phase1'], ['II', 'Strength', 'phase2'], ['III', 'Integration and load', 'phase3']];
    var TARGET = { r: 7, s: 3, c: 5 };
    function $(id) { return document.getElementById(id); }
    function load() {
      if (mem) return mem;
      try { mem = JSON.parse(localStorage.getItem(LOG)); } catch (e) {}
      if (!mem || typeof mem !== 'object') mem = {};
      if (!mem.days) mem.days = {};
      return mem;
    }
    function store() { try { localStorage.setItem(LOG, JSON.stringify(mem)); } catch (e) {} }
    function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
    function parse(s) { var p = s.split('-'); return new Date(+p[0], p[1] - 1, +p[2]); }
    function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
    function midnight() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

    function render() {
      var st = load(), today = midnight();
      var setup = !st.start || root.getAttribute('data-setup') === '1';
      $('t-setup').hidden = !setup;
      $('t-main').hidden = setup;
      if (setup) { $('t-pick').value = st.start || iso(today); return; }

      var start = parse(st.start), d = Math.round((today - start) / 864e5), week = Math.floor(d / 7) + 1;
      var cw = Math.min(Math.max(week, 1), 12), pi = Math.floor((cw - 1) / 4), ph = PH[pi];
      $('t-date').textContent = today.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      if (d < 0) {
        $('t-week').textContent = 'Starts in ' + (-d) + (d === -1 ? ' day' : ' days');
        $('t-phase').textContent = 'Day one is ' + start.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + '. Have a look around until then.';
      } else if (week > 12) {
        $('t-week').textContent = 'Twelve weeks, done';
        $('t-phase').textContent = 'Keep going with Phase III and text me. We’ll plan what comes next.';
      } else {
        $('t-week').innerHTML = 'Week ' + week + ' <span>of 12</span>';
        $('t-phase').textContent = 'Phase ' + ph[0] + ' · ' + ph[1] + ' · Day ' + (d % 7 + 1) + ' of 7';
      }
      var bar = '';
      for (var i = 1; i <= 12; i++) bar += '<span class="' + (d >= 0 && i < week ? 'done' : (d >= 0 && i === week ? 'now' : '')) + '"></span>';
      $('t-bar').innerHTML = bar;
      $('t-jump').setAttribute('href', '#' + ph[2]);

      var w0 = addDays(start, Math.floor(d / 7) * 7), counts = { r: 0, s: 0, c: 0 }, strip = '';
      for (var j = 0; j < 7; j++) {
        var day = addDays(w0, j), k = iso(day), e = st.days[k] || {};
        for (var key in counts) if (e[key]) counts[key]++;
        strip += '<span class="' + (e.r ? 'on ' : '') + (k === iso(today) ? 'today' : '') + '">' + day.toLocaleDateString(undefined, { weekday: 'narrow' }) + '</span>';
      }
      $('t-strip').innerHTML = strip;
      var te = st.days[iso(today)] || {}, ye = st.days[iso(addDays(today, -1))] || {};
      Array.prototype.forEach.call(root.querySelectorAll('input[data-k]'), function (box) {
        var key = box.getAttribute('data-k');
        box.checked = !!te[key];
        $('c-' + key).textContent = counts[key] + ' of ' + TARGET[key] + ' this week';
      });
      $('t-rest').hidden = !(ye.s && !te.s);

      PH.forEach(function (p, n) {
        var sec = $(p[2]); if (!sec) return;
        var tag = sec.querySelector('.weeks'), base = tag.getAttribute('data-base') || tag.textContent;
        tag.setAttribute('data-base', base);
        var state = d < 0 ? '' : (week > 12 || n < pi ? 'Done' : (n === pi ? 'You are here' : ''));
        tag.textContent = base + (state ? ' · ' + state : '');
        sec.classList.toggle('now', state === 'You are here');
        var link = document.querySelector('nav a[href="#' + p[2] + '"]');
        if (link) link.classList.toggle('now', state === 'You are here');
      });
    }

    root.addEventListener('change', function (e) {
      var key = e.target.getAttribute && e.target.getAttribute('data-k');
      if (!key) return;
      var st = load(), k = iso(midnight()), entry = st.days[k] || (st.days[k] = {});
      if (e.target.checked) entry[key] = 1; else delete entry[key];
      store(); render();
    });
    function setStart(v) { if (!v) return; load().start = v; root.removeAttribute('data-setup'); store(); render(); }
    $('t-today').addEventListener('click', function () { setStart(iso(midnight())); });
    $('t-set').addEventListener('click', function () { setStart($('t-pick').value); });
    $('t-change').addEventListener('click', function () { root.setAttribute('data-setup', '1'); render(); });
    render();
  }

  (function () {
    var p = saved();
    if (p) unlock(p, false).catch(function () { save(null); });
  })();
</script>
</body>
</html>
