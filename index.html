<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Private plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ec;
    --surface: #ffffff;
    --text: #20292b;
    --muted: #64716f;
    --line: #e7e0d3;
    --accent: #2d6a63;
    --accent-2: #c9785a;
    --accent-soft: #e4efec;
    --sand: #f1e9db;
    --hero-a: #24524d;
    --hero-b: #3f867c;
    --hero-text: #f6f3ec;
    --warn: #a24a22;
    --warn-soft: #fbece2;
    --shadow: 0 1px 2px rgba(40, 50, 45, .05), 0 8px 24px rgba(40, 50, 45, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121819;
      --surface: #1b2325;
      --text: #e9eceb;
      --muted: #9aa9a6;
      --line: #2b3638;
      --accent: #7fc8be;
      --accent-2: #e0977a;
      --accent-soft: #1d3532;
      --sand: #232c2d;
      --hero-a: #16332f;
      --hero-b: #245a53;
      --hero-text: #eef3f1;
      --warn: #f1a67c;
      --warn-soft: #38281e;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16.5px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0 0 12px; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 16px; }

  /* Lock screen */
  #lock {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: linear-gradient(150deg, var(--hero-a), var(--hero-b));
  }
  #lock form {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border-radius: 20px;
    padding: 32px 26px 26px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    text-align: center;
  }
  #lock .badge {
    width: 52px; height: 52px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: grid; place-items: center;
  }
  #lock .badge svg { width: 24px; height: 24px; stroke: var(--accent); }
  #lock h1 { font-size: 25px; margin: 0 0 6px; }
  #lock p { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
  #lock input[type=password], #lock input[type=text] {
    width: 100%;
    padding: 13px 14px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    text-align: center;
    letter-spacing: .04em;
  }
  #lock input:focus { outline: none; border-color: var(--accent); }
  #lock label.remember {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 14px 0 0; font-size: 14px; color: var(--muted);
  }
  #lock button {
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    font: inherit; font-weight: 600;
    color: #fff;
    background: var(--hero-a);
    border: 0; border-radius: 12px;
    cursor: pointer;
  }
  #lock button:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 22px; margin: 12px 0 0; font-size: 14px; color: var(--warn); }

  /* Plan */
  .hero {
    background: linear-gradient(150deg, var(--hero-a), var(--hero-b));
    color: var(--hero-text);
    padding: 56px 0 84px;
  }
  .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  .hero h1 { font-size: clamp(32px, 7vw, 46px); line-height: 1.1; margin: 10px 0 14px; }
  .hero p { max-width: 560px; opacity: .9; margin: 0; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: -48px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .stat strong { display: block; font-family: Fraunces, Georgia, serif; font-size: 22px; color: var(--accent); line-height: 1.2; }
  .stat span { font-size: 14px; color: var(--muted); }
  nav {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    margin-top: 22px;
  }
  nav .wrap { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a {
    flex: none;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font-size: 14px; font-weight: 500;
    text-decoration: none;
  }
  nav a:hover { border-color: var(--accent); color: var(--accent); }
  main { padding-top: 26px; padding-bottom: 40px; }
  section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px 22px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    scroll-margin-top: 66px;
  }
  .sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .num {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 14px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
    font-family: Fraunces, Georgia, serif; font-size: 21px; font-weight: 600;
  }
  .sec-head h2 { font-size: 24px; line-height: 1.2; margin: 0; }
  .weeks { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-2); }
  .intro { color: var(--muted); }
  h3 {
    font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 8px;
  }
  ul.ex { list-style: none; margin: 0; padding: 0; }
  ul.ex li {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  ul.ex li:first-child { border-top: 0; }
  ul.ex b { display: block; font-weight: 600; }
  ul.ex span { display: block; font-size: 14.5px; color: var(--muted); }
  ul.ex em {
    flex: none;
    font-style: normal; font-size: 13.5px; font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
    margin-top: 1px;
  }
  ul.ticks { list-style: none; margin: 0 0 4px; padding: 0; }
  ul.ticks li { position: relative; padding: 0 0 8px 26px; }
  ul.ticks li::before {
    content: "";
    position: absolute; left: 2px; top: 9px;
    width: 12px; height: 6px;
    border-left: 2px solid var(--accent); border-bottom: 2px solid var(--accent);
    transform: rotate(-45deg);
  }
  .note { background: var(--sand); border-radius: 12px; padding: 12px 14px; font-size: 15px; margin: 16px 0 0; }
  .goals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .goal { background: var(--bg); border-radius: 14px; padding: 14px; }
  .goal strong { display: block; font-family: Fraunces, Georgia, serif; font-size: 19px; color: var(--accent); line-height: 1.25; }
  .goal span { font-size: 14px; color: var(--muted); }
  section.warn { background: var(--warn-soft); border-color: transparent; box-shadow: none; }
  section.warn h2 { color: var(--warn); }
  section.warn .num { background: transparent; border: 1.5px solid var(--warn); color: var(--warn); }
  section.warn ul.ticks li::before {
    width: 6px; height: 6px; top: 10px; left: 5px;
    border: 0; border-radius: 50%; background: var(--warn); transform: none;
  }
  footer { padding-bottom: 44px; color: var(--muted); font-size: 13.5px; }
  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr; margin-top: -40px; }
    .goals { grid-template-columns: 1fr; }
    ul.ex li { flex-direction: column; gap: 6px; }
    section { padding: 22px 18px; }
  }
  @media print {
    nav, #lock { display: none !important; }
    body { background: #fff; font-size: 11pt; }
    .hero { background: none; color: #000; padding: 0 0 12px; }
    .stats { margin-top: 0; }
    section { break-inside: avoid; box-shadow: none; }
  }
</style>
</head>
<body>

<div id="lock">
  <form id="lockform" autocomplete="off">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>Your private plan</h1>
    <p>Enter the password your physical therapist gave you.</p>
    <input id="pw" type="password" aria-label="Password" placeholder="Password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label class="remember"><input id="remember" type="checkbox"> Remember on this device</label>
    <button id="go" type="submit">Open plan</button>
    <div id="msg" role="alert"></div>
  </form>
</div>

<div id="plan" hidden></div>

<script>
  // The plan is stored encrypted (AES-256, key derived from the password with PBKDF2).
  // It is decrypted here in the browser; the password is never sent anywhere.
  var ITERATIONS = 600000;
  var MARKER = '<!--plan-->';
  var KEY = 'plan-pass';

  async function decryptPlan(password, b64) {
    var raw = Uint8Array.from(atob(b64.replace(/\s+/g, '')), function (c) { return c.charCodeAt(0); });
    var salt = raw.slice(8, 16);
    var data = raw.slice(16);
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    var bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' }, base, 384));
    var key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32, 48) }, key, data);
    var html = new TextDecoder().decode(plain);
    if (html.indexOf(MARKER) !== 0) throw new Error('bad password');
    return html;
  }

  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }

  async function unlock(password, remember) {
    var html = await decryptPlan(password, document.getElementById('payload').textContent);
    var plan = document.getElementById('plan');
    plan.innerHTML = html;
    plan.hidden = false;
    document.getElementById('lock').hidden = true;
    document.getElementById('lock').style.display = 'none';
    var t = plan.querySelector('[data-title]');
    if (t) document.title = t.getAttribute('data-title');
    if (remember) save(password);
    window.scrollTo(0, 0);
  }

  document.getElementById('lockform').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('go'), msg = document.getElementById('msg');
    btn.disabled = true; btn.textContent = 'Opening…'; msg.textContent = '';
    try {
      await unlock(document.getElementById('pw').value.trim(), document.getElementById('remember').checked);
    } catch (err) {
      msg.textContent = 'That password did not work. Please try again.';
      btn.disabled = false; btn.textContent = 'Open plan';
    }
  });

  (function () {
    var p = saved();
    if (p) unlock(p, false).catch(function () { save(null); });
  })();
</script>
